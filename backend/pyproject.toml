[project]
name = "thesis-rag"
version = "0.1.0"
description = "Local retrieval foundation for the thesis RAG assistant"
requires-python = ">=3.11,<3.13"
dependencies = [
  "google-auth[requests]>=2.38,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1", "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3", "pypdf>=5,<7", "fonttools>=4,<5", "numpy>=1.26,<3", "httpx>=0.28,<1",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=3.4,<6", "torch>=2.6,<3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL/pgvector test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
