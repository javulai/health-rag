name: thesis-rag

x-backend: &backend
  image: thesis-rag-backend:local
  build:
    context: ../backend
  env_file: ../.env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thesis}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-thesis}
    HF_HOME: /models
    RAW_DATA_DIR: /data/raw
  volumes:
    - model_cache:/models
    - ../data/raw:/data/raw
    - ../data/processed:/data/processed
    - ../data/evaluation:/data/evaluation:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thesis}
      POSTGRES_USER: ${POSTGRES_USER:-thesis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Explicit one-shot ingestion worker; chat queue/lease worker comes in the next stage.
  worker:
    <<: *backend
    profiles: ["tools"]
    entrypoint: ["python", "-m", "app.cli"]
    command: ["--help"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  model_cache:
